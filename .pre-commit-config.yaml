repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: requirements-txt-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --select=PL]
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies: [types-markdown, types-pyyaml, flask, oyaml, weasyprint]
        args: [--strict, --config-file=pyproject.toml]
        files: ^src/

  - repo: https://github.com/pycqa/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-r, src/]
        exclude: tests/

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        args: [--line-length=88]
        exclude: ^(tests/|wiki/|README\.md$)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        args: [--config, ".markdownlint.jsonc"]
        exclude: ^(wiki/|README\.md$)

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.13.6
    hooks:
      - id: markdown-link-check

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        files: ^src/
        pass_filenames: true

      - id: pytest-check
        name: pytest-check
        entry: uv run pytest --collect-only -q
        language: system
        pass_filenames: false
        always_run: true

      - id: sdist-contents
        name: sdist-contains-templates-and-sources
        entry: bash -lc 'set -euo pipefail; mkdir -p dist; rm -f dist/simple_resume-*.tar.gz; UV_CACHE_DIR=.uv-cache uv build --sdist >/dev/null; TARBALL=$(ls -t dist/simple_resume-*.tar.gz | head -n1); tar -tf "$TARBALL" > /tmp/sdist_files.txt; grep -q "simple_resume-.*/simple_resume/shell/assets/templates/html/resume_no_bars.html" /tmp/sdist_files.txt; grep -q "simple_resume-.*/simple_resume/shell/cli/main.py" /tmp/sdist_files.txt; echo sdist contains required source and template files'
        language: system
        pass_filenames: false
        always_run: true

      - id: no-ai-attribution
        name: block-ai-co-authored-by
        entry: |
          bash -c 'if git log --format="%b" -1 HEAD 2>/dev/null | grep -iqE "Co-Authored-By:.*(Claude|Opus|Sonnet|Haiku|Anthropic|GPT|OpenAI|Copilot)"; then echo "ERROR: Commit contains AI Co-Authored-By line. Remove it."; exit 1; fi'
        language: system
        stages: [commit-msg]
        always_run: true

      - id: architecture-tests
        name: architecture-layer-separation
        entry: bash -c 'uv run pytest tests/architecture/test_layer_separation.py --quiet --tb=short || (echo "Architecture tests failing (expected during refactoring - see CORE_REFACTOR_PLAN.md)" && exit 0)'
        language: system
        pass_filenames: false
        always_run: true

      - id: wheel-install-test
        name: wheel-installation-and-execution-test
        # Tests that the wheel builds, installs, and executes correctly.
        # Set DEBUG_HOOK=1 for verbose output during troubleshooting.
        entry: |
          bash -lc '
            set -euo pipefail

            # Prepare build directory
            mkdir -p dist
            rm -f dist/simple_resume-*.whl

            # Configure verbosity based on DEBUG_HOOK
            if [[ -n "${DEBUG_HOOK:-}" ]]; then
              UV_QUIET=""
              PIP_QUIET=""
              echo "DEBUG: Verbose mode enabled (set DEBUG_HOOK=1)"
            else
              UV_QUIET="--quiet"
              PIP_QUIET="-q"
            fi

            # Build the wheel
            UV_CACHE_DIR=.uv-cache uv build --wheel $UV_QUIET
            WHEEL=$(ls -t dist/simple_resume-*.whl | head -n1)
            if [[ -z "$WHEEL" ]]; then
              echo "ERROR: wheel build failed - no wheel file found"
              exit 1
            fi

            # Create isolated venv and install
            VENV_DIR=$(mktemp -d)
            trap "rm -rf $VENV_DIR" EXIT
            python3 -m venv "$VENV_DIR"
            source "$VENV_DIR/bin/activate"
            pip install $PIP_QUIET "$WHEEL"

            # Verify installation
            if ! simple-resume --version >/dev/null 2>&1; then
              echo "ERROR: simple-resume command failed after installation"
              exit 1
            fi

            VERSION=$(simple-resume --version 2>&1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
            echo "CLI installs and executes correctly (v$VERSION)"

            # Python API smoke test (issue #84 regression guard)
            TEST_DIR=$(mktemp -d)
            mkdir -p "$TEST_DIR/input"
            cp sample/input/sample_1.yaml "$TEST_DIR/input/"
            printf "%s\n" \
              "import simple_resume" \
              "result = simple_resume.generate(" \
              "    \"sample_1\"," \
              "    options=simple_resume.GenerateOptions(formats=(\"html\",), data_dir=\"$TEST_DIR\")," \
              ")" \
              "assert \"html\" in result, f\"Expected html key, got {list(result.keys())}\"" \
              "print(\"Python API generate() works without explicit service registration\")" \
              > "$TEST_DIR/smoke_test.py"
            python3 "$TEST_DIR/smoke_test.py"
            rm -rf "$TEST_DIR"
          '
        language: system
        pass_filenames: false
        always_run: true
