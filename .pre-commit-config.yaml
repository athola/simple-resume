repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: requirements-txt-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --select=PL]
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies: [types-markdown, types-pyyaml, flask, oyaml, weasyprint]
        args: [--strict, --config-file=pyproject.toml]
        files: ^src/

  - repo: https://github.com/pycqa/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-r, src/]
        exclude: tests/

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        args: [--line-length=88]
        exclude: ^(tests/|wiki/|README\.md$)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        args: [--config, ".markdownlint.jsonc"]
        exclude: ^(wiki/|README\.md$)

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.13.6
    hooks:
      - id: markdown-link-check

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        files: ^src/
        pass_filenames: true

      - id: pytest-check
        name: pytest-check
        entry: uv run pytest --collect-only -q
        language: system
        pass_filenames: false
        always_run: true

      - id: sdist-contents
        name: sdist-contains-templates-and-sources
        entry: bash -lc 'set -euo pipefail; mkdir -p dist; rm -f dist/simple_resume-*.tar.gz; UV_CACHE_DIR=.uv-cache uv build --sdist >/dev/null; TARBALL=$(ls -t dist/simple_resume-*.tar.gz | head -n1); tar -tf "$TARBALL" > /tmp/sdist_files.txt; grep -q "simple_resume-.*/simple_resume/shell/assets/templates/html/resume_no_bars.html" /tmp/sdist_files.txt; grep -q "simple_resume-.*/simple_resume/shell/cli/main.py" /tmp/sdist_files.txt; echo sdist contains required source and template files'
        language: system
        pass_filenames: false
        always_run: true

      - id: architecture-tests
        name: architecture-layer-separation
        entry: bash -c 'uv run pytest tests/architecture/test_layer_separation.py --quiet --tb=short || (echo "Architecture tests failing (expected during refactoring - see CORE_REFACTOR_PLAN.md)" && exit 0)'
        language: system
        pass_filenames: false
        always_run: true

      - id: wheel-install-test
        name: wheel-installation-and-execution-test
        entry: >
          bash -lc '
          set -euo pipefail;
          mkdir -p dist;
          rm -f dist/simple_resume-*.whl;
          UV_CACHE_DIR=.uv-cache uv build --wheel >/dev/null 2>&1;
          WHEEL=$(ls -t dist/simple_resume-*.whl | head -n1);
          VENV_DIR=$(mktemp -d);
          trap "rm -rf $VENV_DIR" EXIT;
          python3 -m venv "$VENV_DIR" >/dev/null 2>&1;
          source "$VENV_DIR/bin/activate";
          pip install -q "$WHEEL" 2>&1 | grep -v "^Installing" || true;
          if ! simple-resume --version >/dev/null 2>&1; then
            echo "ERROR: simple-resume command failed after installation";
            exit 1;
          fi;
          VERSION=$(simple-resume --version 2>&1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+");
          echo "Package installs and executes correctly (v$VERSION)"
          '
        language: system
        pass_filenames: false
        always_run: true
